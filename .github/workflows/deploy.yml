name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        run: |
          mkdir -p site
          curl -fsSL "https://script.google.com/macros/s/AKfycbyscmNk9x67bfg3djrkqB5DJv4XUanOrOSgJUUjCFhz91dlmC8vxsXEbrtMLVD7pHDwfA/exec?raw=site" -o site/index.html
          test "$(wc -c < site/index.html)" -gt 50000
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
